services:
  - type: web
    name: origin-farm-agent
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/ADLSHEVA/Agricultural-Informatization-Intelligent-Agent
    branch: main
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --port $PORT
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.17.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://origin-api-n4v5i2jtda-ew.a.run.app
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
